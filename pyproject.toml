[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "embedded-model"
version = "0.1.0"
description = "교체 가능하고 확장성 있는 임베딩 모델 추상화 패키지"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy==2.4.6",
    "huggingface_hub==1.23.0",
    "FlagEmbedding==1.4.0",           # bge-m3 dense+sparse
]

[project.optional-dependencies]
sentence-transformers = ["sentence-transformers==5.6.0"]   # 범용 dense 백엔드 (SentenceTransformerModel)

[tool.setuptools.packages.find]
include = ["embedded*"]        # embedded 패키지만 설치 대상으로